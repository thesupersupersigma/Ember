[workspace]
resolver = "2"
members = [
    "crates/ember-sig",
    "crates/ember-inject",
    "crates/ember-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["thesupersupersigma"]
repository = ""

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

# ember.exe (bin "ember") and ember.dll (lib "ember") both emit ember.pdb, which
# collides. We don't ship pdbs for v1, so strip debuginfo in release — this also
# removes the collision warning and shrinks the binaries.
[profile.release]
debug = false
strip = "debuginfo"
