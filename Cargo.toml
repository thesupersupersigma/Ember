[workspace]
resolver = "2"
members = [
    "crates/ember-sig",
    "crates/ember-inject",
    "crates/ember-core",
    "crates/ember-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["thesupersupersigma"]
repository = ""

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

# Launcher is ember-launcher.exe and the DLL is ember.dll — different base names,
# so their .pdb files no longer collide. Strip symbols; v1 ships no pdbs.
[profile.release]
debug = false
strip = "symbols"
