name: Release

# Build Ember and publish a GitHub Release whenever a version tag is pushed.
# Example:
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the release and upload assets

jobs:
  build:
    name: Build & release (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p ember-core -p ember-inject

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/ember-launcher.exe dist/
          Copy-Item target/release/ember.dll          dist/
          Get-ChildItem dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ember-launcher.exe
            dist/ember.dll
          generate_release_notes: true
          fail_on_unmatched_files: true
